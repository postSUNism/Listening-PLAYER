
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语精听播放器 | Morandi Glass</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e9e4f0 0%, #d3d9d4 50%, #e2ebf0 100%);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.3);
            --haze-blue: #7b94a1;
            --haze-blue-deep: #5e7885;
            --text-main: #4a4a4a;
            --radius-lg: 24px;
            --radius-sm: 12px;
        }
        body { background: var(--bg-gradient); background-attachment: fixed; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; padding: 40px 20px; color: var(--text-main); margin: 0; }
        .container { max-width: 800px; width: 100%; }
        .player-card { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 30px; border-radius: var(--radius-lg); border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-weight: 300; color: var(--haze-blue-deep); letter-spacing: 2px; margin: 0; }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; align-items: center; flex-wrap: wrap; }
        button { padding: 10px 20px; border-radius: 50px; border: none; background: var(--haze-blue); color: white; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        button:hover { background: var(--haze-blue-deep); transform: translateY(-1px); }
        button.secondary { background: rgba(255,255,255,0.5); color: var(--haze-blue); border: 1px solid var(--haze-blue); }
        .speed-control { font-size: 0.8rem; color: var(--haze-blue-deep); }
        .sentence-list { display: flex; flex-direction: column; gap: 10px; }
        .sentence-item { padding: 15px 20px; background: rgba(255, 255, 255, 0.2); border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .sentence-item:hover { background: rgba(255, 255, 255, 0.4); }
        .sentence-item.active { background: rgba(123, 148, 161, 0.15); border-left: 5px solid var(--haze-blue); }
        .index { font-weight: bold; margin-right: 10px; opacity: 0.5; }
    </style>
</head>

                </div>
            </div>
            <div id="list" class="sentence-list"></div>
        </div>

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV","altPronunciation":"","useAltPronunciation":false}];
        let currentIndex = -1;
        let isAutoPlaying = false;
        let currentAudio = null;
        let isLoop = false;

        function render() {
            const listEl = document.getElementById('list');
            listEl.innerHTML = data.map((s, i) => `
                <div class="sentence-item" id="item-${i}" onclick="playOne(${i})">
                    <span class="index">${i+1}</span>
                    <span>${s.text}</span>
                </div>
            `).join('');
        }

        function updateSpeedDisp() {
            const speedVal = document.getElementById('speed').value;
            document.getElementById('speedVal').innerText = speedVal;
        }

        function toggleLoop() {
            isLoop = !isLoop;
            document.getElementById('loopBtn').innerText = `🔁 循环: ${isLoop ? '开' : '关'}`;
        }

        function playOne(index, autoNext = false) {
            stopAll();
            currentIndex = index;
            isAutoPlaying = autoNext;

            document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById('item-' + index);
            if (activeEl) {
                activeEl.classList.add('active');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const item = data[index];
            const playbackRate = parseFloat(document.getElementById('speed').value);
            const speakText = item.useAltPronunciation && item.altPronunciation.trim() 
                ? item.altPronunciation.trim() 
                : item.text;

            if (item.audioBase64 && item.audioBase64.startsWith('data:audio')) {
                currentAudio = new Audio(item.audioBase64);
                currentAudio.playbackRate = playbackRate;
                currentAudio.onended = () => { if(isAutoPlaying || isLoop) playNext(); };
                currentAudio.play();
                document.getElementById('playBtn').innerText = "⏸ 暂停";
            } else {
                const u = new SpeechSynthesisUtterance(speakText);
                u.lang = 'en-US';
                u.rate = playbackRate;
                u.onend = () => { if(isAutoPlaying || isLoop) playNext(); };
                window.speechSynthesis.speak(u);
                document.getElementById('playBtn').innerText = "⏸ 暂停";
            }
        }

        function prev() {
            const target = currentIndex <= 0 ? data.length - 1 : currentIndex - 1;
            playOne(target, isAutoPlaying);
        }

        function next() {
            const target = currentIndex >= data.length - 1 ? 0 : currentIndex + 1;
            playOne(target, isAutoPlaying);
        }

        function playNext() {
            if (isLoop) {
                playOne(currentIndex, true);
            } else if (currentIndex < data.length - 1) {
                playOne(currentIndex + 1, true);
            } else {
                isAutoPlaying = false;
                document.getElementById('playBtn').innerText = "▶ 播放";
            }
        }

        function playAll() {
            if (data.length > 0) playOne(0, true);
        }

        function togglePlay() {
            if (currentAudio) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    document.getElementById('playBtn').innerText = "⏸ 暂停";
                } else {
                    currentAudio.pause();
                    document.getElementById('playBtn').innerText = "▶ 播放";
                }
            } else if (currentIndex >= 0) {
                playOne(currentIndex, isAutoPlaying); 
            } else {
                playAll();
            }
        }

        function stopAll() {
            isAutoPlaying = false;
            document.getElementById('playBtn').innerText = "▶ 播放";
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            window.speechSynthesis.cancel();
        }

        render();
        updateSpeedDisp();
    </script>
